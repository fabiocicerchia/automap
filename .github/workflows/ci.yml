name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history rules need real history, not a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python3 tests/test_archmap.py

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail on architecture drift
        run: |
          if [ -f .archmap.baseline.json ]; then
            python3 archmap.py check .
          else
            echo "no baseline committed yet; generating one"
            python3 archmap.py map .
          fi
