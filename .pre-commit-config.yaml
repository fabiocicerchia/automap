# Run `pre-commit install` once per clone (or `make setup`).
#
# Hooks are pinned to a commit SHA with the tag in a comment, the same policy the
# GitHub Actions workflows use: a tag can be moved, a SHA cannot. CI runs this
# file (`pre-commit/action`), so what is here is what gates a pull request.
#
# Everything above the language blocks is the portfolio-wide baseline and is
# identical in every repo. Keep the language blocks the project actually needs
# and delete the rest — a hook for a language the repo does not contain costs an
# environment install on every CI run and checks nothing.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      # Whitespace and line endings.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      # A UTF-8 BOM makes a shebang unreadable and a JSON parser choke, and it
      # is invisible in every diff view — strip it rather than debug it.
      - id: fix-byte-order-marker

      # Parseable data files: a broken manifest fails here rather than in a
      # deploy.
      - id: check-yaml
        # k8s manifests are legitimately multi-document, and Helm templates are Go
        # templates rather than YAML — the parser cannot read either as-is. The
        # exclude is path-relative so it catches chart/ and charts/<name>/ alike.
        # mkdocs.yml carries Material's `!!python/name:...` tags, which safe_load
        # rejects; `mkdocs build --strict` in CI validates it instead.
        args: [--allow-multiple-documents]
        exclude: (^|/)templates/|^mkdocs\.yml$
      - id: check-json
        # A TypeScript project keeps comments in tsconfig.json (JSONC), which is
        # not JSON — exclude it there:
        # exclude: ^tsconfig.*\.json$
      - id: check-toml
      # Python only (types: [python]) — a no-op in a repo with no .py files, so
      # it stays in the baseline rather than the language block below.
      - id: check-ast
      # Sorts and dedupes requirements files, which is where most of the
      # merge conflicts in docs/requirements.txt came from.
      - id: requirements-txt-fixer

      # Things that are only painful once they are in history.
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: forbid-submodules
      - id: check-vcs-permalinks

      # A script without its executable bit does not run.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

      - id: detect-private-key
      - id: detect-aws-credentials
        # Without this the hook fails on any machine that has no
        # ~/.aws/credentials — i.e. every CI runner — regardless of the diff.
        args: [--allow-missing-credentials]

      # Python only — `breakpoint()` and pdb imports left in a commit.
      # - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # --- Language blocks: keep what applies, delete what does not. ---

  # Python. Lint and format; per-repo strictness lives in pyproject.toml.
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2  # v0.16.1
  #   hooks:
  #     - id: ruff-check
  #     - id: ruff-format

  # Go. Local hooks rather than a third-party golang mirror: the toolchain is
  # already required to build, so there is nothing extra to install.
  # - repo: local
  #   hooks:
  #     - id: gofmt
  #       name: gofmt
  #       # -w rather than a bare -l: `gofmt -l` exits 0 even when it lists a
  #       # file, so it can never fail the hook. Rewriting is what pre-commit
  #       # detects.
  #       entry: gofmt -l -w
  #       language: system
  #       types: [go]
  #     - id: go-vet
  #       name: go vet
  #       entry: go vet ./...
  #       language: system
  #       types: [go]
  #       pass_filenames: false

  # JavaScript / TypeScript. Biome rather than eslint: one binary, no plugin
  # matrix, no new entry in package.json. Through npx as a local hook — the
  # biomejs/pre-commit environment installs the wrapper without its platform
  # binary and dies. Rules go in biome.json; keep the formatter off unless the
  # repo is ready for the reformat.
  # - repo: local
  #   hooks:
  #     - id: biome
  #       name: biome
  #       entry: npx --yes @biomejs/biome@2.5.7 ci --files-ignore-unknown=true --no-errors-on-unmatched
  #       language: system
  #       types_or: [javascript, jsx, ts, tsx]

  # Lua. From the published image: pre-commit's own `language: lua` needs
  # luarocks on the runner, and the quality job only has Python. Declare the
  # host's injected globals (ngx, core) in .luacheckrc or every one is a warning.
  # - repo: local
  #   hooks:
  #     - id: luacheck
  #       name: luacheck
  #       language: docker_image
  #       entry: pipelinecomponents/luacheck@sha256:29b50ed2cb99e4eea19522f0c9b3b104661437e0b5158921df2d111eb6c5af2e luacheck
  #       types: [lua]

  # Terraform. fmt only — `terraform_validate` would need a `terraform init`
  # (and a provider download) per directory, which is a CI job, not a hook.
  # - repo: https://github.com/antonbabenko/pre-commit-terraform
  #   rev: bf9dd9c695ddaf238af36f179049202358ec22b7  # v1.108.1
  #   hooks:
  #     - id: terraform_fmt
